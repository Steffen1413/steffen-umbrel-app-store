services:
  app_proxy:
    container_name: gbrain_app_proxy_1
    environment:
      APP_HOST: gbrain_web_1
      APP_PORT: 3131
      PROXY_AUTH_ADD: "false"
      PROXY_TRUST_UPSTREAM: "true"

  web:
    container_name: gbrain_web_1
    build: ${APP_DATA_DIR}
    restart: unless-stopped
    stop_grace_period: 30s
    env_file:
      - ${APP_DATA_DIR}/secrets/gbrain.env
    environment:
      HOME: /data
      GBRAIN_HOME: /data
      GBRAIN_NO_ONBOARD_NUDGE: "1"
      GBRAIN_HTTP_CORS_ORIGIN: "http://192.168.188.40:3131,http://localhost:3131"
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - ${APP_DATA_DIR}/brain:/brain
      - ${APP_DATA_DIR}/data/.gbrain/persistence/reservations/.gbrain-owner-430ae444967bf0680407d82932f98d8c7e6368226d2783426c9412a3db086342.json:/.gbrain-owner-430ae444967bf0680407d82932f98d8c7e6368226d2783426c9412a3db086342.json:ro
      - /home/umbrel/umbrel/app-data/hermes-agent/data/hermes/skills:/hermes-skills:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3131/health >/dev/null || curl -fsS http://127.0.0.1:3131/mcp >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

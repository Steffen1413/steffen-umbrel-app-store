services:
  web:
    image: node:20-alpine
    container_name: homelab-hermes-desktop-bridge_web_1
    restart: always
    ports:
      - "18791:8080"
    volumes:
      - ${APP_DATA_DIR}/proxy.js:/app/proxy.js:ro
    environment:
      PORT: "8080"
      HERMES_UPSTREAM_HOST: hermes-agent_web_1
      HERMES_UPSTREAM_PORT: "18789"
    command:
      - node
      - /app/proxy.js
networks:
  default:
    name: umbrel_main_network
    external: true

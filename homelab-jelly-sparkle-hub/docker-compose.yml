services:
  app_proxy:
    container_name: jelly-sparkle-hub_app_proxy_1
    environment:
      APP_HOST: jelly_sparkle_hub_web_1
      APP_PORT: 80
      PROXY_AUTH_ADD: "false"

  web:
    container_name: jelly_sparkle_hub_web_1
    image: ghcr.io/steffen1413/jelly-sparkle-hub@sha256:bfb49e1bc60a2f6edadd209e7b2a006fa013ace75729bb37ab1b4780ea121a6f
    restart: unless-stopped
    env_file:
      - ${APP_DATA_DIR}/.env.runtime

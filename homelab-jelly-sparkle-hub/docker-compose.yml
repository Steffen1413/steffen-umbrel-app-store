services:
  app_proxy:
    container_name: jelly-sparkle-hub_app_proxy_1
    environment:
      APP_HOST: jelly_sparkle_hub_web_1
      APP_PORT: 80
      PROXY_AUTH_ADD: "false"

  web:
    container_name: jelly_sparkle_hub_web_1
    image: ghcr.io/steffen1413/jelly-sparkle-hub@sha256:ba49b4f91816a4369f81530bae5a01fc84bd25c2886e0f9f5aa9b629a16e3c69
    restart: unless-stopped
    env_file:
      - ${APP_DATA_DIR}/.env.runtime

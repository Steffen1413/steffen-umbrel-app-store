services:
  app_proxy:
    container_name: jelly-sparkle-hub_app_proxy_1
    environment:
      APP_HOST: jelly_sparkle_hub_web_1
      APP_PORT: 80
      PROXY_AUTH_ADD: "false"

  web:
    container_name: jelly_sparkle_hub_web_1
    image: ghcr.io/steffen1413/jelly-sparkle-hub@sha256:65c21980c15a66314747bb4c257132957dd9e5da4636709a2cfef7013d709761
    restart: unless-stopped
    env_file:
      - ${APP_DATA_DIR}/.env.runtime

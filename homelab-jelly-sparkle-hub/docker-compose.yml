services:
  app_proxy:
    container_name: jelly-sparkle-hub_app_proxy_1
    environment:
      APP_HOST: jelly_sparkle_hub_web_1
      APP_PORT: 80
      PROXY_AUTH_ADD: "false"

  web:
    container_name: jelly_sparkle_hub_web_1
    image: ghcr.io/steffen1413/jelly-sparkle-hub@sha256:7aee80399da9dd5bac11eb7b4c824eeb1c7e405971b2034f1cda961cf36f467b
    restart: unless-stopped
    env_file:
      - ${APP_DATA_DIR}/.env.runtime

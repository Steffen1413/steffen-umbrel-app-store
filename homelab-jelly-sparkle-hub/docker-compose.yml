services:
  app_proxy:
    container_name: jelly-sparkle-hub_app_proxy_1
    environment:
      APP_HOST: jelly_sparkle_hub_web_1
      APP_PORT: 80
      PROXY_AUTH_ADD: "false"

  web:
    container_name: jelly_sparkle_hub_web_1
    image: ghcr.io/steffen1413/jelly-sparkle-hub@sha256:44d33a515d76a4367fdd998cf3ce8f1a387cc9a72a34d2d0b072506bb5ade0cf
    restart: unless-stopped
    env_file:
      - ${APP_DATA_DIR}/.env.runtime

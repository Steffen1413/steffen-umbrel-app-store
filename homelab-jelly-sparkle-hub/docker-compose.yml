services:
  app_proxy:
    container_name: jelly-sparkle-hub_app_proxy_1
    environment:
      APP_HOST: jelly_sparkle_hub_web_1
      APP_PORT: 80
      PROXY_AUTH_ADD: "false"

  web:
    container_name: jelly_sparkle_hub_web_1
    image: ghcr.io/steffen1413/jelly-sparkle-hub@sha256:2dd177bb373a60f9d4ba357742843245630931a52dce24f4260fd383638df6d1
    restart: unless-stopped
    env_file:
      - ${APP_DATA_DIR}/.env.runtime

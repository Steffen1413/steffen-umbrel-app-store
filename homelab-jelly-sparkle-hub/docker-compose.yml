services:
  app_proxy:
    container_name: jelly-sparkle-hub_app_proxy_1
    environment:
      APP_HOST: jelly_sparkle_hub_web_1
      APP_PORT: 80
      PROXY_AUTH_ADD: "false"

  web:
    container_name: jelly_sparkle_hub_web_1
    image: ghcr.io/steffen1413/jelly-sparkle-hub@sha256:6f436211914cdb02d1b0f443c6f94c19b1c9e11a8bef67c8ad8eb36ec6bcf3ca
    restart: unless-stopped
    env_file:
      - ${APP_DATA_DIR}/.env.runtime

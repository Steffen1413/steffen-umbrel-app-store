services:
  app_proxy:
    container_name: jelly-sparkle-hub_app_proxy_1
    environment:
      APP_HOST: jelly_sparkle_hub_web_1
      APP_PORT: 80
      PROXY_AUTH_ADD: "false"

  web:
    container_name: jelly_sparkle_hub_web_1
    image: ghcr.io/steffen1413/jelly-sparkle-hub@sha256:af73235f604904564b2350c00b005f966d83464ec891028f64321507877a31db
    restart: unless-stopped
    env_file:
      - ${APP_DATA_DIR}/.env.runtime

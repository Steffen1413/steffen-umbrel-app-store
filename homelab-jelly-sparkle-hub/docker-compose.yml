services:
  app_proxy:
    container_name: jelly-sparkle-hub_app_proxy_1
    environment:
      APP_HOST: jelly_sparkle_hub_web_1
      APP_PORT: 80
      PROXY_AUTH_ADD: "false"

  web:
    container_name: jelly_sparkle_hub_web_1
    image: ghcr.io/steffen1413/jelly-sparkle-hub@sha256:0a7e4d90331f2602573953511b4def63f9d59cde59ca2beb078f690e2a849a4e
    restart: unless-stopped
    env_file:
      - ${APP_DATA_DIR}/.env.runtime

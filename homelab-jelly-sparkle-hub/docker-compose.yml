services:
  app_proxy:
    container_name: jelly-sparkle-hub_app_proxy_1
    environment:
      APP_HOST: jelly_sparkle_hub_web_1
      APP_PORT: 80
      PROXY_AUTH_ADD: "false"

  web:
    container_name: jelly_sparkle_hub_web_1
    image: ghcr.io/steffen1413/jelly-sparkle-hub@sha256:2698816267c63078bcda21ea9bbed531f62d9bba0cd32ded8bc1e5c732686245
    restart: unless-stopped
    env_file:
      - ${APP_DATA_DIR}/.env.runtime

services:
  app_proxy:
    container_name: jelly-sparkle-hub_app_proxy_1
    environment:
      APP_HOST: jelly_sparkle_hub_web_1
      APP_PORT: 80
      PROXY_AUTH_ADD: "false"

  web:
    container_name: jelly_sparkle_hub_web_1
    image: ghcr.io/steffen1413/jelly-sparkle-hub@sha256:4824c1cdc22716bc210341aa417fceb12ee7c585092b8b692d1b370ebf937a0e
    restart: unless-stopped
    env_file:
      - ${APP_DATA_DIR}/.env.runtime

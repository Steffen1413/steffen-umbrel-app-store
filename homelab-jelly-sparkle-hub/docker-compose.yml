services:
  app_proxy:
    container_name: jelly-sparkle-hub_app_proxy_1
    environment:
      APP_HOST: jelly_sparkle_hub_web_1
      APP_PORT: 80
      PROXY_AUTH_ADD: "false"

  web:
    container_name: jelly_sparkle_hub_web_1
    image: ghcr.io/steffen1413/jelly-sparkle-hub@sha256:7a1a72b81bad4a94f805544cb5d7d87dd214e0185ed6bb2f6033ed21fa3ae4ae
    restart: unless-stopped
    env_file:
      - ${APP_DATA_DIR}/.env.runtime

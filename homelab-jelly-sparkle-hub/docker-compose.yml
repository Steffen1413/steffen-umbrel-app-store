services:
  app_proxy:
    container_name: jelly-sparkle-hub_app_proxy_1
    environment:
      APP_HOST: jelly_sparkle_hub_web_1
      APP_PORT: 80
      PROXY_AUTH_ADD: "false"

  web:
    container_name: jelly_sparkle_hub_web_1
    image: ghcr.io/steffen1413/jelly-sparkle-hub@sha256:db0807ff3e4eee96e3345adeb5719461e7a7594274d6e14a0b7c8debd60cb3fc
    restart: unless-stopped
    env_file:
      - ${APP_DATA_DIR}/.env.runtime

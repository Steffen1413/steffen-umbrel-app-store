services:
  app_proxy:
    container_name: jelly-sparkle-hub_app_proxy_1
    environment:
      APP_HOST: jelly_sparkle_hub_web_1
      APP_PORT: 80
      PROXY_AUTH_ADD: "false"

  web:
    container_name: jelly_sparkle_hub_web_1
    image: ghcr.io/steffen1413/jelly-sparkle-hub@sha256:8ccc9e655f3fbaaf9c24d14c46dd6557addcb93ec8ba176a2684eac424dfff47
    restart: unless-stopped
    env_file:
      - ${APP_DATA_DIR}/.env.runtime

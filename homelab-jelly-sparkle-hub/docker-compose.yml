services:
  app_proxy:
    container_name: jelly-sparkle-hub_app_proxy_1
    environment:
      APP_HOST: jelly_sparkle_hub_web_1
      APP_PORT: 80
      PROXY_AUTH_ADD: "false"

  web:
    container_name: jelly_sparkle_hub_web_1
    image: ghcr.io/steffen1413/jelly-sparkle-hub@sha256:e61ff45db229b1017c98f0037687c34e376dee9d8ad93ef820c4603e1aecc4bc
    restart: unless-stopped
    env_file:
      - ${APP_DATA_DIR}/.env.runtime

services:
  app_proxy:
    container_name: jelly-sparkle-hub_app_proxy_1
    environment:
      APP_HOST: jelly_sparkle_hub_web_1
      APP_PORT: 80
      PROXY_AUTH_ADD: "false"

  web:
    container_name: jelly_sparkle_hub_web_1
    image: ghcr.io/steffen1413/jelly-sparkle-hub@sha256:33d8059a8156a32f09bd582196631f0bad40015fe1d8589affa4bac0e00da399
    restart: unless-stopped
    env_file:
      - ${APP_DATA_DIR}/.env.runtime

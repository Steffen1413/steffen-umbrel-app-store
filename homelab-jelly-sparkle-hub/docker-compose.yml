services:
  app_proxy:
    container_name: jelly-sparkle-hub_app_proxy_1
    environment:
      APP_HOST: jelly_sparkle_hub_web_1
      APP_PORT: 80
      PROXY_AUTH_ADD: "false"

  web:
    container_name: jelly_sparkle_hub_web_1
    image: ghcr.io/steffen1413/jelly-sparkle-hub@sha256:8f92c3a1cbbf3300d51c24fff19c9988c8c0c774545f2a869454536ba47d40e8
    restart: unless-stopped
    env_file:
      - ${APP_DATA_DIR}/.env.runtime

services:
  app_proxy:
    container_name: jelly-sparkle-hub_app_proxy_1
    environment:
      APP_HOST: jelly_sparkle_hub_web_1
      APP_PORT: 80
      PROXY_AUTH_ADD: "false"

  web:
    container_name: jelly_sparkle_hub_web_1
    image: ghcr.io/steffen1413/jelly-sparkle-hub@sha256:5361bf80fe406e75a51fc5a0f3b557cb81828563096d2d67dc2ad131708dcb92
    restart: unless-stopped
    env_file:
      - ${APP_DATA_DIR}/.env.runtime

services:
  app_proxy:
    container_name: jelly-sparkle-hub_app_proxy_1
    environment:
      APP_HOST: jelly_sparkle_hub_web_1
      APP_PORT: 80
      PROXY_AUTH_ADD: "false"

  web:
    container_name: jelly_sparkle_hub_web_1
    image: ghcr.io/steffen1413/jelly-sparkle-hub@sha256:9df977e4cfbd7eaba5af4f978c96a1c0576b406f280ec13109e9edca4964b2e3
    restart: unless-stopped
    env_file:
      - ${APP_DATA_DIR}/.env.runtime

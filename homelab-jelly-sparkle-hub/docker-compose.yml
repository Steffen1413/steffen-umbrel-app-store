services:
  app_proxy:
    container_name: jelly-sparkle-hub_app_proxy_1
    environment:
      APP_HOST: jelly_sparkle_hub_web_1
      APP_PORT: 80
      PROXY_AUTH_ADD: "false"

  web:
    container_name: jelly_sparkle_hub_web_1
    image: ghcr.io/steffen1413/jelly-sparkle-hub@sha256:6d21f3de3ef3802065468c1805119d82879c548ade88113a83dbf63aa524d16b
    restart: unless-stopped
    env_file:
      - ${APP_DATA_DIR}/.env.runtime

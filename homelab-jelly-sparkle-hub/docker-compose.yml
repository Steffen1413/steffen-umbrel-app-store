services:
  app_proxy:
    container_name: jelly-sparkle-hub_app_proxy_1
    environment:
      APP_HOST: jelly_sparkle_hub_web_1
      APP_PORT: 80
      PROXY_AUTH_ADD: "false"

  web:
    container_name: jelly_sparkle_hub_web_1
    image: ghcr.io/steffen1413/jelly-sparkle-hub@sha256:5eb85b117f576e8f0cb6e60816c11dd35dde9d5902b09b51e3e428edb8fe3adb
    restart: unless-stopped
    env_file:
      - ${APP_DATA_DIR}/.env.runtime

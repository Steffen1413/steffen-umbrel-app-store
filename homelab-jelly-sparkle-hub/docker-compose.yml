services:
  app_proxy:
    container_name: jelly-sparkle-hub_app_proxy_1
    environment:
      APP_HOST: jelly_sparkle_hub_web_1
      APP_PORT: 80
      PROXY_AUTH_ADD: "false"

  web:
    container_name: jelly_sparkle_hub_web_1
    image: ghcr.io/steffen1413/jelly-sparkle-hub@sha256:c011ce2471ba0135e205e3629b36de44253b2f3356c27bdb73a2eff1c3f83143
    restart: unless-stopped
    env_file:
      - ${APP_DATA_DIR}/.env.runtime

services:
  app_proxy:
    container_name: jelly-sparkle-hub_app_proxy_1
    environment:
      APP_HOST: jelly_sparkle_hub_web_1
      APP_PORT: 80
      PROXY_AUTH_ADD: "false"

  web:
    container_name: jelly_sparkle_hub_web_1
    image: ghcr.io/steffen1413/jelly-sparkle-hub@sha256:f0a143f326843e03e576a1dfc1f262ae5b3a1c06c8fba41ead488fc1115f3110
    restart: unless-stopped
    env_file:
      - ${APP_DATA_DIR}/.env.runtime

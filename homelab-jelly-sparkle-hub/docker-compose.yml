services:
  app_proxy:
    container_name: jelly-sparkle-hub_app_proxy_1
    environment:
      APP_HOST: jelly_sparkle_hub_web_1
      APP_PORT: 80
      PROXY_AUTH_ADD: "false"

  web:
    container_name: jelly_sparkle_hub_web_1
    image: ghcr.io/steffen1413/jelly-sparkle-hub@sha256:561012151e1f8f8140b6047dd322e0cc594b221c907631e95e2a59a46f9e99b2
    restart: unless-stopped
    env_file:
      - ${APP_DATA_DIR}/.env.runtime

services:
  app_proxy:
    container_name: jelly-sparkle-hub_app_proxy_1
    environment:
      APP_HOST: jelly_sparkle_hub_web_1
      APP_PORT: 80
      PROXY_AUTH_ADD: "false"

  web:
    container_name: jelly_sparkle_hub_web_1
    image: ghcr.io/steffen1413/jelly-sparkle-hub@sha256:847e6a962bb5dc5ef3ff1db2c70d29721d568d20d9f2370dcb169448ac087313
    restart: unless-stopped
    env_file:
      - ${APP_DATA_DIR}/.env.runtime

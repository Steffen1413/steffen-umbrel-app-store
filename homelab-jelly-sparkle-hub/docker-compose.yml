services:
  app_proxy:
    container_name: jelly-sparkle-hub_app_proxy_1
    environment:
      APP_HOST: jelly_sparkle_hub_web_1
      APP_PORT: 80
      PROXY_AUTH_ADD: "false"

  web:
    container_name: jelly_sparkle_hub_web_1
    image: ghcr.io/steffen1413/jelly-sparkle-hub@sha256:e5d3dd49ed5b714b1bf706122c82820213088426377b27d2b9f83c63beff4ce3
    restart: unless-stopped
    env_file:
      - ${APP_DATA_DIR}/.env.runtime

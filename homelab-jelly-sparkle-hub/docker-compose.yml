services:
  app_proxy:
    container_name: jelly-sparkle-hub_app_proxy_1
    environment:
      APP_HOST: jelly_sparkle_hub_web_1
      APP_PORT: 80
      PROXY_AUTH_ADD: "false"

  web:
    container_name: jelly_sparkle_hub_web_1
    image: ghcr.io/steffen1413/jelly-sparkle-hub@sha256:424c21c722087b9ba361a99b2269b1bcdec00c709784b1e0d2dee9a3eb335077
    restart: unless-stopped
    env_file:
      - ${APP_DATA_DIR}/.env.runtime

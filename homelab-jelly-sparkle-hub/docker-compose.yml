services:
  app_proxy:
    container_name: jelly-sparkle-hub_app_proxy_1
    environment:
      APP_HOST: jelly_sparkle_hub_web_1
      APP_PORT: 80
      PROXY_AUTH_ADD: "false"

  web:
    container_name: jelly_sparkle_hub_web_1
    image: ghcr.io/steffen1413/jelly-sparkle-hub@sha256:cc55e02065bb4e8056650cdf5d89dbd971ce8bf1a6c720f7ecf7ccc25cf3a67a
    restart: unless-stopped
    env_file:
      - ${APP_DATA_DIR}/.env.runtime

services:
  app_proxy:
    container_name: jelly-sparkle-hub_app_proxy_1
    environment:
      APP_HOST: jelly_sparkle_hub_web_1
      APP_PORT: 80
      PROXY_AUTH_ADD: "false"

  web:
    container_name: jelly_sparkle_hub_web_1
    image: ghcr.io/steffen1413/jelly-sparkle-hub@sha256:1fffc81ce138d17fc0e48cddfc97c7927df87ca252913a3c2e905570a38dd773
    restart: unless-stopped
    env_file:
      - ${APP_DATA_DIR}/.env.runtime

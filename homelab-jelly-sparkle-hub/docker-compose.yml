services:
  app_proxy:
    container_name: jelly-sparkle-hub_app_proxy_1
    environment:
      APP_HOST: jelly_sparkle_hub_web_1
      APP_PORT: 80
      PROXY_AUTH_ADD: "false"

  web:
    container_name: jelly_sparkle_hub_web_1
    image: ghcr.io/steffen1413/jelly-sparkle-hub@sha256:a798796bd9fd04211b0fc5bde068286fcc2070600fc693752070d365100a728b
    restart: unless-stopped
    env_file:
      - ${APP_DATA_DIR}/.env.runtime

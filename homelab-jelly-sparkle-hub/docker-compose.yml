services:
  app_proxy:
    container_name: jelly-sparkle-hub_app_proxy_1
    environment:
      APP_HOST: jelly_sparkle_hub_web_1
      APP_PORT: 80
      PROXY_AUTH_ADD: "false"

  web:
    container_name: jelly_sparkle_hub_web_1
    image: ghcr.io/steffen1413/jelly-sparkle-hub@sha256:3e801342413269e9a4d5911ea96dc0a07b3367e97ee41a6aa6d889736c9cac8f
    restart: unless-stopped
    env_file:
      - ${APP_DATA_DIR}/.env.runtime

services:
  app_proxy:
    container_name: jelly-sparkle-hub_app_proxy_1
    environment:
      APP_HOST: jelly_sparkle_hub_web_1
      APP_PORT: 80
      PROXY_AUTH_ADD: "false"

  web:
    container_name: jelly_sparkle_hub_web_1
    image: ghcr.io/steffen1413/jelly-sparkle-hub@sha256:794539f9d625f0d0fc2d28985e9f8fa293460bbd591a408723d346f7e6b196a0
    restart: unless-stopped
    env_file:
      - ${APP_DATA_DIR}/.env.runtime

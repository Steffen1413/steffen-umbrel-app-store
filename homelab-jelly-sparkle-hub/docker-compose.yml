services:
  app_proxy:
    container_name: jelly-sparkle-hub_app_proxy_1
    environment:
      APP_HOST: jelly_sparkle_hub_web_1
      APP_PORT: 80
      PROXY_AUTH_ADD: "false"

  web:
    container_name: jelly_sparkle_hub_web_1
    image: ghcr.io/steffen1413/jelly-sparkle-hub@sha256:fdd1ff36e0789d714fa3bb42f7ff1ae8008f6cc875c7a69d9f7a2af68664cd6d
    restart: unless-stopped
    env_file:
      - ${APP_DATA_DIR}/.env.runtime

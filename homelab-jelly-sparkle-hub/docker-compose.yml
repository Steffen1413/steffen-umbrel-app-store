services:
  app_proxy:
    container_name: jelly-sparkle-hub_app_proxy_1
    environment:
      APP_HOST: jelly_sparkle_hub_web_1
      APP_PORT: 80
      PROXY_AUTH_ADD: "false"

  web:
    container_name: jelly_sparkle_hub_web_1
    image: ghcr.io/steffen1413/jelly-sparkle-hub@sha256:cfd63a79922ca980f9d556eb1a166370d2084a72df7954190b9771ecb9bb4780
    restart: unless-stopped
    env_file:
      - ${APP_DATA_DIR}/.env.runtime

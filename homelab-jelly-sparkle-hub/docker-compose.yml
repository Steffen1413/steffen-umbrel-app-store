services:
  app_proxy:
    container_name: jelly-sparkle-hub_app_proxy_1
    environment:
      APP_HOST: jelly_sparkle_hub_web_1
      APP_PORT: 80
      PROXY_AUTH_ADD: "false"

  web:
    container_name: jelly_sparkle_hub_web_1
    image: ghcr.io/steffen1413/jelly-sparkle-hub@sha256:228a33ac2c92c011b11e264462eb6b18230ac037b8197e817c7b765397c5cbf1
    restart: unless-stopped
    env_file:
      - ${APP_DATA_DIR}/.env.runtime

services:
  app_proxy:
    container_name: jelly-sparkle-hub_app_proxy_1
    environment:
      APP_HOST: jelly_sparkle_hub_web_1
      APP_PORT: 80
      PROXY_AUTH_ADD: "false"

  web:
    container_name: jelly_sparkle_hub_web_1
    image: ghcr.io/steffen1413/jelly-sparkle-hub@sha256:334f2108ae62a7094ddb842559dfb02190dc35cb70036caf1814842f189d021f
    restart: unless-stopped
    env_file:
      - ${APP_DATA_DIR}/.env.runtime

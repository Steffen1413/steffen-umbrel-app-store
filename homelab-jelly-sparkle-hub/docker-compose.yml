services:
  app_proxy:
    container_name: jelly-sparkle-hub_app_proxy_1
    environment:
      APP_HOST: jelly_sparkle_hub_web_1
      APP_PORT: 80
      PROXY_AUTH_ADD: "false"

  web:
    container_name: jelly_sparkle_hub_web_1
    image: ghcr.io/steffen1413/jelly-sparkle-hub@sha256:8b0b91a18289007fba36e7394627787f40df73d2492e5c215e5374f152df31a4
    restart: unless-stopped
    env_file:
      - ${APP_DATA_DIR}/.env.runtime

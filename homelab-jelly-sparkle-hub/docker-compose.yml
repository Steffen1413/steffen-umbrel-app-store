services:
  app_proxy:
    container_name: jelly-sparkle-hub_app_proxy_1
    environment:
      APP_HOST: jelly_sparkle_hub_web_1
      APP_PORT: 80
      PROXY_AUTH_ADD: "false"

  web:
    container_name: jelly_sparkle_hub_web_1
    image: ghcr.io/steffen1413/jelly-sparkle-hub@sha256:0e4b0a185789cc6007326b6ab00209df9529eb247bfc1ce9dabd72e4fada1cd9
    restart: unless-stopped
    env_file:
      - ${APP_DATA_DIR}/.env.runtime

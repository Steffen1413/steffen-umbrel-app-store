services:
  app_proxy:
    container_name: jelly-sparkle-hub_app_proxy_1
    environment:
      APP_HOST: jelly_sparkle_hub_web_1
      APP_PORT: 80
      PROXY_AUTH_ADD: "false"

  web:
    container_name: jelly_sparkle_hub_web_1
    image: ghcr.io/steffen1413/jelly-sparkle-hub@sha256:85e110e91fe1fb9eca55bb25dd6e9c9faba0079eb8d421853f7e6ca0c226dac5
    restart: unless-stopped
    env_file:
      - ${APP_DATA_DIR}/.env.runtime

services:
  app_proxy:
    container_name: jelly-sparkle-hub_app_proxy_1
    environment:
      APP_HOST: jelly_sparkle_hub_web_1
      APP_PORT: 80
      PROXY_AUTH_ADD: "false"

  web:
    container_name: jelly_sparkle_hub_web_1
    image: ghcr.io/steffen1413/jelly-sparkle-hub@sha256:55c40b915c37cb341d2a574d1b96e6b4612e41682bc8a29da7afbd1dc281e44f
    restart: unless-stopped
    env_file:
      - ${APP_DATA_DIR}/.env.runtime

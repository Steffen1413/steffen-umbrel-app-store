services:
  app_proxy:
    container_name: jelly-sparkle-hub_app_proxy_1
    environment:
      APP_HOST: jelly_sparkle_hub_web_1
      APP_PORT: 80
      PROXY_AUTH_ADD: "false"

  web:
    container_name: jelly_sparkle_hub_web_1
    image: ghcr.io/steffen1413/jelly-sparkle-hub@sha256:a15decdac9091060ac411cbe2c790246a99e642b4c2ced697b4bfb02579170b1
    restart: unless-stopped
    env_file:
      - ${APP_DATA_DIR}/.env.runtime

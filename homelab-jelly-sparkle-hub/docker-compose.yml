services:
  app_proxy:
    container_name: jelly-sparkle-hub_app_proxy_1
    environment:
      APP_HOST: jelly_sparkle_hub_web_1
      APP_PORT: 80
      PROXY_AUTH_ADD: "false"

  web:
    container_name: jelly_sparkle_hub_web_1
    image: ghcr.io/steffen1413/jelly-sparkle-hub@sha256:75dd2474bfb67042794d07eaf8da08fe01dd930a9b8860e2f4dc8ab37c000624
    restart: unless-stopped
    env_file:
      - ${APP_DATA_DIR}/.env.runtime

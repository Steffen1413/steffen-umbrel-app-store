services:
  app_proxy:
    container_name: jelly-sparkle-hub_app_proxy_1
    environment:
      APP_HOST: jelly_sparkle_hub_web_1
      APP_PORT: 80
      PROXY_AUTH_ADD: "false"

  web:
    container_name: jelly_sparkle_hub_web_1
    image: ghcr.io/steffen1413/jelly-sparkle-hub@sha256:cd7c5a856dd91084dc2adb1ffb7a817aa8ab714a9ebc882b847fdc2b545e41fb
    restart: unless-stopped
    env_file:
      - ${APP_DATA_DIR}/.env.runtime

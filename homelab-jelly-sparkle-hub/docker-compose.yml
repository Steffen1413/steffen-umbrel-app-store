services:
  app_proxy:
    container_name: jelly-sparkle-hub_app_proxy_1
    environment:
      APP_HOST: jelly_sparkle_hub_web_1
      APP_PORT: 80
      PROXY_AUTH_ADD: "false"

  web:
    container_name: jelly_sparkle_hub_web_1
    image: ghcr.io/steffen1413/jelly-sparkle-hub@sha256:549897b7e416a7abc53867f3f0e94af212cf576c34804fa2ec68bbdbda8c79e1
    restart: unless-stopped
    env_file:
      - ${APP_DATA_DIR}/.env.runtime

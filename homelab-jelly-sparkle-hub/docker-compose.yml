services:
  app_proxy:
    container_name: jelly-sparkle-hub_app_proxy_1
    environment:
      APP_HOST: jelly_sparkle_hub_web_1
      APP_PORT: 80
      PROXY_AUTH_ADD: "false"

  web:
    container_name: jelly_sparkle_hub_web_1
    image: ghcr.io/steffen1413/jelly-sparkle-hub@sha256:5b0b497c71ac10d75b9104361c7c88e6ba0e0f1557716498530e53fce4f17a04
    restart: unless-stopped
    env_file:
      - ${APP_DATA_DIR}/.env.runtime

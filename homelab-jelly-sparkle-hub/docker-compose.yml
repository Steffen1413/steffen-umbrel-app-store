services:
  app_proxy:
    container_name: jelly-sparkle-hub_app_proxy_1
    environment:
      APP_HOST: jelly_sparkle_hub_web_1
      APP_PORT: 80
      PROXY_AUTH_ADD: "false"

  web:
    container_name: jelly_sparkle_hub_web_1
    image: ghcr.io/steffen1413/jelly-sparkle-hub@sha256:22ea59cc1d13680b28f50c7b50a47bc135f96bfa8b1af268286a797859296c3d
    restart: unless-stopped
    env_file:
      - ${APP_DATA_DIR}/.env.runtime

services:
  app_proxy:
    container_name: jelly-sparkle-hub_app_proxy_1
    environment:
      APP_HOST: jelly_sparkle_hub_web_1
      APP_PORT: 80
      PROXY_AUTH_ADD: "false"

  web:
    container_name: jelly_sparkle_hub_web_1
    image: ghcr.io/steffen1413/jelly-sparkle-hub@sha256:50521f83b185eda7d6594742927813a19da9fa1bba089175ffb69e31ecac4c2a
    restart: unless-stopped
    env_file:
      - ${APP_DATA_DIR}/.env.runtime

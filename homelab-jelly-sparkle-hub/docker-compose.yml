services:
  app_proxy:
    container_name: jelly-sparkle-hub_app_proxy_1
    environment:
      APP_HOST: jelly_sparkle_hub_web_1
      APP_PORT: 80
      PROXY_AUTH_ADD: "false"

  web:
    container_name: jelly_sparkle_hub_web_1
    image: ghcr.io/steffen1413/jelly-sparkle-hub@sha256:993306addf9c68887fd97c6a10e7b1ea5b9c9744ccf7e51c95e9a92150e03d6a
    restart: unless-stopped
    env_file:
      - ${APP_DATA_DIR}/.env.runtime

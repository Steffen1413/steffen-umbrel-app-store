services:
  app_proxy:
    container_name: jelly-sparkle-hub_app_proxy_1
    environment:
      APP_HOST: jelly_sparkle_hub_web_1
      APP_PORT: 80
      PROXY_AUTH_ADD: "false"

  web:
    container_name: jelly_sparkle_hub_web_1
    image: ghcr.io/steffen1413/jelly-sparkle-hub@sha256:e230075ca885c8ae9f350c46f26de6ee9bf1b411694bd794bcc78b785258cf56
    restart: unless-stopped
    env_file:
      - ${APP_DATA_DIR}/.env.runtime

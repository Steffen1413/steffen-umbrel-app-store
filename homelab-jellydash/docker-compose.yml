services:
  app_proxy:
    environment:
      APP_HOST: jellydash
      APP_PORT: 80
      PROXY_AUTH_ADD: 'false'
    container_name: homelab-jellydash_app_proxy_1
    depends_on:
      jellydash:
        condition: service_healthy

  jellydash:
    image: ghcr.io/themartz90/jellydash:latest@sha256:e540a8502982eda9b8a0ddbc092727126aaf13cd696361c665b3e9ef8b6705e7
    container_name: jellydash
    restart: unless-stopped
    env_file:
      - ${APP_DATA_DIR}/jellydash.env
    environment:
      APP_ENV: production
      APP_DEBUG: 'false'
      APP_TIMEZONE: Europe/Berlin
      TZ: Europe/Berlin
      DB_DRIVER: sqlite3
      DB_NAME: /var/www/html/var/data/jellydash.sqlite
      JELLYFIN_VERIFY_SSL: 'true'
      LIBRARIES_CACHE_TTL: '300'
      POLLER_ENABLED: 'true'
      POLL_INTERVAL: '30'
      PUSH_ENABLED: 'false'
      AUTH_ENABLED: 'false'
      FORCE_HTTPS: 'false'
    volumes:
      - ${APP_DATA_DIR}/cache:/var/www/html/cache
      - ${APP_DATA_DIR}/runtime-cache:/var/www/html/var/cache
      - ${APP_DATA_DIR}/logs:/var/www/html/var/log
      - ${APP_DATA_DIR}/uploads:/var/www/html/public/uploads
      - ${APP_DATA_DIR}/data:/var/www/html/var/data
